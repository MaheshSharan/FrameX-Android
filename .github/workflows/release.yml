name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, sign and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-android

      # The in-app updater compares the tag with the installed versionName, so a tag that
      # disagrees with the build would offer users a version the APK does not carry.
      - name: Check tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $declared"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The release body is what the updater shows users, so it comes from the changelog.
      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            $0 == "## " v { found = 1; next }
            /^## /        { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # An APK signed with the debug key cannot update installs of earlier releases.
      - name: Verify APK and write checksum
        run: |
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "${apks[0]}" | tee certs.txt
          if grep -q "Android Debug" certs.txt; then
            echo "::error::Release APK is signed with the debug key"
            exit 1
          fi
          # The updater reads this line from the release body to verify the download.
          printf '\nSHA-256: %s\n' "$(sha256sum "${apks[0]}" | cut -d' ' -f1)" >> notes.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
