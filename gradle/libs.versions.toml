[versions]
agp = "8.2.2"
kotlin = "1.9.22"
core-ktx = "1.12.0"
lifecycle = "2.7.0"
activity-compose = "1.8.2"
compose = "1.6.1"
material3 = "1.2.0"
navigation-compose = "2.7.7"
hilt = "2.50"
