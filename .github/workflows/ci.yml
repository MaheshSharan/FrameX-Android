name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: ./.github/actions/setup-android

      - name: Privilege layer boundary
        run: |
          if grep -rIl --include='*.kt' 'ShizukuManager' app/src/main \
              | grep -v -e '/privilege/' -e '/shizuku/'; then
            echo "ShizukuManager may only be used inside privilege/ and shizuku/" >&2
            exit 1
          fi

      - name: Size limits (functions 60 lines, files 500 lines)
        run: python3 config/check_size_limits.py

      # One invocation: Gradle shares its daemon and configuration across the tasks.
      - name: Lint, unit tests, debug build
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Release build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-android

      # Minification only breaks at release time, so exercise it on every change instead
      # of discovering it when a tag is pushed. Unsigned here; the release workflow signs.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
