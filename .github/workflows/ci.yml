name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Privilege layer boundary
        run: |
          if grep -rIl --include='*.kt' 'ShizukuManager' app/src/main \
              | grep -v -e '/privilege/' -e '/shizuku/'; then
            echo "ShizukuManager may only be used inside privilege/ and shizuku/" >&2
            exit 1
          fi

      # ktlint and detekt are advisory until baselines are committed. To make them blocking:
      #   ./gradlew detektBaseline ktlintGenerateBaseline   (commit the two baseline files)
      # then delete the `continue-on-error` lines below.
      - name: ktlint
        run: ./gradlew ktlintCheck
        continue-on-error: true

      - name: detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug
