version: 2
updates:
  # Keeps the commit-SHA pins in the workflows current. One PR per month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns: ["*"]
    # The build toolchain is pinned together (see AGENTS.md) and upgraded as one
    # planned change, so these are not offered one by one.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.android*"
      - dependency-name: "com.google.dagger*"
      - dependency-name: "androidx.compose*"
      - dependency-name: "gradle-wrapper"
      - dependency-name: "androidx.navigation*"
      - dependency-name: "androidx.hilt*"
      - dependency-name: "androidx.datastore*"
